<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farmer Marketplace - Login</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        background: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 10px;
    }

    .mobile {
        width: 100%;
        max-width: 420px;
        background: #ffffff;
        border-radius: 30px;
        overflow: hidden;
        border: 1px solid #e0e0e0;
        box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    .header {
        background: #156b1d;
        padding: 40px 25px;
        color: #fff;
        text-align: center;
    }

    .header h1 { font-size: 24px; margin-bottom: 10px; }
    .header p { font-size: 14px; opacity: 0.9; }

    .logo {
        width: 100px;
        height: 100px;
        margin: -50px auto 20px;
        background: #fff;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 50px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        border: 4px solid #ffffff;
    }

    .form { padding: 0 30px 20px; }

    label { display: block; margin-bottom: 8px; color: #444; font-weight: 600; font-size: 14px; }

    .input-box {
        display: flex;
        align-items: center;
        background: #f8f9fa;
        border: 2px solid #e9ecef;
        border-radius: 12px;
        padding: 0 15px;
        margin-bottom: 20px;
        transition: 0.3s;
    }

    .input-box:focus-within { border-color: #156b1d; background: #fff; }

    .input-box i { color: #aaa; margin-right: 10px; }

    .input-box input {
        width: 100%;
        padding: 14px 0;
        border: none;
        outline: none;
        background: transparent;
        font-size: 15px;
    }

    .links { text-align: right; margin-bottom: 20px; }
    .links a { color: #156b1d; text-decoration: none; font-size: 13px; font-weight: 600; }

    .login-btn {
        width: 100%;
        padding: 15px;
        background: #156b1d;
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    .login-btn:hover { background: #115517; transform: translateY(-2px); }

    .register { margin-top: 25px; text-align: center; color: #555; font-size: 14px; }
    .register a { color: #156b1d; text-decoration: none; font-weight: bold; }

    .features {
        margin-top: 30px;
        padding: 20px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        background: #fafafa;
        border-top: 1px solid #f0f0f0;
    }

    .feature-btn {
        background: #ffffff;
        border: 1px solid #e9ecef;
        border-radius: 12px;
        padding: 15px 5px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    .feature-btn:hover {
        background: #edf8ed;
        border-color: #156b1d;
        transform: translateY(-3px);
        box-shadow: 0 4px 10px rgba(21, 107, 29, 0.1);
    }

    .feature-btn i { color: #156b1d; font-size: 22px; margin-bottom: 8px; transition: 0.3s; }
    .feature-btn span { font-size: 11px; font-weight: 700; color: #555; }

    /* Footer - Updated to match primary green */
    .footer { 
        text-align: center; 
        padding: 15px; 
        margin: 15px 20px 20px; 
        color: #ffffff; 
        font-weight: 600;
        font-size: 12px; 
        background: #156b1d; /* Matched the login button and header */
        border-radius: 16px; 
        box-shadow: 0 4px 10px rgba(21, 107, 29, 0.3);
    }
</style>
</head>
<body>

<div class="mobile">
    <div class="header">
        <h1>🌾 Farmer Marketplace</h1>
        <p>Connecting farmers, buyers, and logistics.</p>
    </div>

    <div class="logo">🚜</div>

    <div class="form">
        <label>Username</label>
        <div class="input-box">
            <i class="fa-solid fa-user"></i>
            <input type="text" placeholder="Enter your username" id="username">
        </div>

        <label>Password</label>
        <div class="input-box">
            <i class="fa-solid fa-lock"></i>
            <input type="password" placeholder="Enter your password" id="password">
        </div>

        <div class="links">
            <a href="#">Forgot Password?</a>
        </div>

        <button class="login-btn" onclick="login()">Login</button>

        <div class="register">
            Don't have an account? <a href="Register.html">Register</a>
        </div>
    </div>

    <div class="features">
        <button class="feature-btn" onclick="location.href='Crops.html'">
            <i class="fa-solid fa-seedling"></i>
            <span>Crops</span>
        </button>
        <button class="feature-btn" onclick="location.href='Market.html'">
            <i class="fa-solid fa-store"></i>
            <span>Market</span>
        </button>
        <button class="feature-btn" onclick="location.href='Delivery.html'">
            <i class="fa-solid fa-truck"></i>
            <span>Delivery</span>
        </button>
    </div>

    <div class="footer">© 2026 Farmer Marketplace. All Rights Reserved.</div>
</div>

<script>
    function login() {
        let username = document.getElementById("username").value.trim();
        let password = document.getElementById("password").value.trim();
        if(username === "" || password === "") {
            alert("Please enter your username and password.");
            return;
        }
        window.location.href = "HomeScreen.html";
    }
</script>

</body>
</html>
